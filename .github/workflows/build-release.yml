name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install fonttools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check fonttools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Windows MSI
        run: .\gradlew.bat :desktopApp:packageReleaseMsi --no-daemon

      - name: Print jpackage logs on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "================ JPACKAGE ARGS ================" -ForegroundColor Yellow
          $argsFile = "desktopApp/build/compose/tmp/packageReleaseMsi.args.txt"
          if (Test-Path $argsFile) {
            Get-Content $argsFile
          } else {
            Write-Host "Args file not found."
          }

          Write-Host "`n================ JPACKAGE LOGS ================" -ForegroundColor Red
          $logDir = "desktopApp/build/compose/logs"
          if (Test-Path $logDir) {
            Get-ChildItem -Path $logDir -Filter "*.txt" -Recurse | ForEach-Object {
              Write-Host "--- File: $($_.FullName) ---" -ForegroundColor Cyan
              Get-Content $_.FullName
              Write-Host "-----------------------------------------`n"
            }
          } else {
            Write-Host "Log directory not found."
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: timex-windows
          path: desktopApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install --yes fakeroot

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install fonttools
        run: python -m pip install --disable-pip-version-check fonttools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux DEB
        run: ./gradlew :desktopApp:packageReleaseDeb --no-daemon

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: timex-linux
          path: desktopApp/build/compose/binaries/main-release/deb/*.deb
          if-no-files-found: error

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: android sdk install platforms/android-37.0 build-tools/37.0.0 platform-tools

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install fonttools
        run: python -m pip install --disable-pip-version-check fonttools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "$variable is not configured" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/timex-release.jks"
          test -s "$RUNNER_TEMP/timex-release.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/timex-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: timex-android
          path: |
            androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    permissions:
      contents: write
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-linux
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release-assets/**
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
